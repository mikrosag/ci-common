name: dynamic-tests-nix

on:
  workflow_call:
    inputs:
      test-command:
        description: "Command to run inside the Nix devShell"
        type: string
        default: "python3 -m pytest tests/ -v"
        required: false

jobs:
  test:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add Nix to PATH
        run: echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      - name: Run tests in Nix devShell
        run: nix develop -c ${{ inputs.test-command }}
