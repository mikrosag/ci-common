name: dynamic-tests-container

on:
  workflow_call:
    inputs:
      dockerfile:
        description: "Dockerfile to build for the test image"
        type: string
        default: "Dockerfile.test"
        required: false
      test-command:
        description: "Command to run inside the container"
        type: string
        default: "pytest tests/ -v"
        required: false

jobs:
  test:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Inputs reach the shell through env: rather than being interpolated into
      # the script. GitHub expands ${{ }} by pasting text in before bash parses
      # it, so caller-controlled input becomes script syntax; an env var stays
      # data the shell never re-parses. (semgrep: run-shell-injection.)
      - name: Build test image
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          TAG: ${{ github.sha }}
        run: docker build -f "$DOCKERFILE" -t "local/dynamic-test:$TAG" .
      # $TEST_COMMAND is deliberately UNQUOTED: it is a command line and must
      # word-split into arguments for `docker run`. $TAG is quoted because it is
      # a single value.
      - name: Run tests in container
        env:
          TAG: ${{ github.sha }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: docker run --rm "local/dynamic-test:$TAG" $TEST_COMMAND
