name: dynamic-tests-container

on:
  workflow_call:
    inputs:
      dockerfile:
        description: "Dockerfile to build for the test image"
        type: string
        default: "Dockerfile.test"
        required: false
      test-command:
        description: "Command to run inside the container"
        type: string
        default: "pytest tests/ -v"
        required: false

jobs:
  test:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build test image
        run: docker build -f "${{ inputs.dockerfile }}" -t local/dynamic-test:${{ github.sha }} .
      - name: Run tests in container
        run: docker run --rm local/dynamic-test:${{ github.sha }} ${{ inputs.test-command }}
