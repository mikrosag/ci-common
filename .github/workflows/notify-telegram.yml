name: notify-telegram

on:
  workflow_call:
    inputs:
      message:
        description: "Message text to send (Markdown supported)"
        type: string
        required: true
    secrets:
      bot-token:
        required: true
      chat-id:
        required: true

jobs:
  notify:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Send Telegram message
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.bot-token }}/sendMessage" \
            -d chat_id="${{ secrets.chat-id }}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="${{ inputs.message }}" \
            > /dev/null
