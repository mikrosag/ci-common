name: security-checks

on:
  workflow_call:
    inputs:
      semgrep-ruleset:
        description: "Semgrep registry ruleset to fetch. Change this and semgrep-ruleset-sha256 together."
        type: string
        default: "p/default"
        required: false
      semgrep-ruleset-hash:
        description: "Expected canonical hash of the fetched ruleset (rules sorted by id, then hashed -- NOT a hash of the raw bytes, see the sast job). The scan fails if the registry serves different rules."
        type: string
        default: "b60be047ae607844e9a68d5d7d43355d060f177520323e4f1db626c5a0a20317"
        required: false
      semgrep-rule-count:
        description: "Expected number of rules in the ruleset. A cheap second signal that reads more usefully than a hash when it changes."
        type: string
        default: "1074"
        required: false
      semgrep-version:
        description: "Expected semgrep engine version. Verified, not installed -- the binary comes from Homebrew on the runner."
        type: string
        default: "1.168.0"
        required: false

jobs:
  # gitleaks and semgrep were two separate jobs until 2026-08-13. Both are pure
  # scans over the same checkout with no shared state, so splitting them bought
  # parallelism -- which this org does not have: one self-hosted runner means
  # they ran back to back anyway, each paying its own checkout and ~5s of runner
  # handoff. Merging removes one full clone and one handoff per run, across
  # every repo, and halves the per-job billing floor for whichever of these
  # later moves to a hosted runner (jobs there bill rounded UP to a whole
  # minute, and these average well under one).
  #
  # The obvious hazard in merging parallel jobs is that the first failure hides
  # the second -- you fix gitleaks, re-run, and only then discover semgrep was
  # also failing. Both scans therefore run with continue-on-error and a final
  # step decides the verdict, so a single run still reports both.
  scan:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 because gitleaks scans history, not just the working
      # tree. semgrep does not need it, but this is one checkout serving both
      # and a full clone was already being paid for by the old secret-scan job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        id: gitleaks
        continue-on-error: true
        run: gitleaks detect --source . --no-banner --redact

      # This step used to run `semgrep scan --config auto`. `auto` resolves the
      # ruleset from the registry at scan time, so the set of rules could change
      # without anything in this org changing. On 2026-08-11 it did: the ruleset
      # acquired github-actions-mutable-action-tag, and mcp-gateway and
      # agent-bridge both went red on code neither of them had touched. There
      # was no way to tell that from a real regression, which is the actual
      # problem -- a gate whose verdict can change on its own teaches people to
      # dismiss its failures.
      #
      # Both halves of the scan are now pinned: the engine below, and the rules
      # in the two steps after it.
      - name: Verify the semgrep engine version
        id: engine
        continue-on-error: true
        env:
          EXPECTED_VERSION: ${{ inputs.semgrep-version }}
        # Verified rather than installed. semgrep comes from Homebrew on the
        # shared runner (see README), so a `brew upgrade` can move it under us.
        # Failing loudly on drift beats silently scanning with a different
        # engine; pinning by installing here would fight the host's package
        # manager on every run.
        run: |
          actual="$(semgrep --version 2>/dev/null | head -1)"
          expected="$EXPECTED_VERSION"
          if [ "$actual" != "$expected" ]; then
            echo "FAIL: semgrep engine drifted -- expected ${expected}, runner has ${actual}." >&2
            echo "Either pin the runner back (brew), or bump semgrep-version in" >&2
            echo "ci-common's security-checks.yml after checking what changed." >&2
            exit 1
          fi
          echo "semgrep engine ${actual} as expected"

      - name: Fetch and verify the pinned ruleset
        id: ruleset
        continue-on-error: true
        env:
          RULESET: ${{ inputs.semgrep-ruleset }}
          EXPECTED_HASH: ${{ inputs.semgrep-ruleset-hash }}
          EXPECTED_COUNT: ${{ inputs.semgrep-rule-count }}
        # Written to the workspace root, not a temp dir, on purpose: semgrep
        # namespaces rule ids by the path of the config file, so an absolute
        # path leaks the runner's directory layout into every rule id and makes
        # them differ between machines. A cwd-relative file yields the exact
        # same ids `auto` produced, which keeps output readable and keeps
        # existing `// nosemgrep: <rule-id>` suppressions matching.
        #
        # The file is untracked, and semgrep only scans git-tracked files, so it
        # does not end up scanning its own ruleset.
        # Hashed CANONICALLY, not byte-for-byte. The registry serves the same
        # rules in a different order between requests: two fetches an hour apart
        # gave identical byte counts and an identical set of 1074 rule ids, but
        # different sha256s. A raw byte hash therefore fails at random, which
        # would make this gate noise rather than signal -- exactly the outcome
        # pinning is meant to prevent. Sorting the rules by id and hashing that
        # is stable against reordering while still catching a rule being added,
        # removed, or edited.
        run: |
          curl -sSfL "https://semgrep.dev/c/${RULESET}" -o .semgrep-pinned.yaml
          out="$(python3 -c 'import yaml, hashlib, json; rules = sorted(yaml.safe_load(open(".semgrep-pinned.yaml")).get("rules", []), key=lambda r: r.get("id", "")); print(hashlib.sha256(json.dumps(rules, sort_keys=True, separators=(",", ":")).encode()).hexdigest(), len(rules))')"
          actual="${out%% *}"
          count="${out##* }"
          expected="$EXPECTED_HASH"
          expected_count="$EXPECTED_COUNT"
          if [ "$actual" != "$expected" ]; then
            echo "FAIL: the ${RULESET} ruleset changed upstream." >&2
            echo "  expected hash:  ${expected}  (${expected_count} rules)" >&2
            echo "  got hash:       ${actual}  (${count} rules)" >&2
            echo "" >&2
            echo "This is not necessarily a problem -- it means the registry published" >&2
            echo "different rules. Review what changed, then update semgrep-ruleset-hash" >&2
            echo "and semgrep-rule-count in ci-common's security-checks.yml in a PR, so" >&2
            echo "the new rules land deliberately and every repo picks them up at the" >&2
            echo "same moment rather than one repo at a time by surprise." >&2
            exit 1
          fi
          echo "ruleset ${RULESET} verified (${count} rules, canonical ${actual})"

      # Skipped rather than run unpinned if either pin check failed: scanning
      # with an unverified engine or ruleset would produce a verdict we cannot
      # reason about, which is the whole thing the pinning exists to avoid.
      - name: semgrep
        id: semgrep
        if: steps.engine.outcome == 'success' && steps.ruleset.outcome == 'success'
        continue-on-error: true
        run: semgrep scan --config .semgrep-pinned.yaml --error

      # Single verdict for the whole job. Every scan above ran regardless of the
      # others' results, so this reports all of them at once instead of making
      # you fix one, re-run, and discover the next.
      - name: Verdict
        run: |
          fail=0
          report() {
            case "$2" in
              success) echo "  PASS  $1" ;;
              skipped) echo "  SKIP  $1 (pin check failed above)"; fail=1 ;;
              *)       echo "  FAIL  $1"; fail=1 ;;
            esac
          }
          report "gitleaks (secrets)"        "${{ steps.gitleaks.outcome }}"
          report "semgrep engine pin"        "${{ steps.engine.outcome }}"
          report "semgrep ruleset pin"       "${{ steps.ruleset.outcome }}"
          report "semgrep (SAST)"            "${{ steps.semgrep.outcome }}"
          if [ "$fail" -ne 0 ]; then
            echo "security-checks failed -- see the individual step logs above." >&2
            exit 1
          fi
          echo "all security checks passed"
