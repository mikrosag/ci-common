name: lint-js

on:
  workflow_call:
    inputs:
      lint-command:
        description: "Lint command to run after npm ci"
        type: string
        default: "npx eslint ."
        required: false

jobs:
  eslint:
    # ubuntu-latest ships node and npm, so this needs no pinned install --
    # unlike the scanners, the toolchain comes from the caller's package.json
    # and is already pinned by its lockfile.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      # Passed via env: rather than interpolated. GitHub expands ${{ }} by
      # pasting text into the script before bash parses it, so a caller's input
      # becomes script syntax; an env var stays data. (semgrep:
      # run-shell-injection.)
      #
      # Unquoted on purpose: this input IS a command line and must word-split
      # into a command plus arguments.
      - env:
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: $LINT_COMMAND
