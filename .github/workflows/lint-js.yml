name: lint-js

on:
  workflow_call:
    inputs:
      lint-command:
        description: "Lint command to run after npm ci"
        type: string
        default: "npx eslint ."
        required: false

jobs:
  eslint:
    # ubuntu-latest ships node and npm, so this needs no pinned install --
    # unlike the scanners, the toolchain comes from the caller's package.json
    # and is already pinned by its lockfile.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      # Passed via env: rather than interpolated. GitHub expands ${{ }} by
      # pasting text into the script before bash parses it, so a caller's input
      # becomes script syntax; an env var stays data. (semgrep:
      # run-shell-injection.)
      #
      # Handed to an explicit interpreter rather than word-split -- see
      # dynamic-tests-nix.yml for the failure this avoids: unquoted expansion
      # does not re-interpret quotes, so any caller whose command contains
      # quoting would break.
      - env:
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: bash -c "$LINT_COMMAND"
