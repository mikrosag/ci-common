name: mcp-server-security-gate

# Fail-closed admission gate for onboarding a new (or changed) MCP server onto the
# gateway -- called from any repo's ci.yml whenever a change touches a path matching
# `**/mcp-servers/**` or adds/changes a `registry/*.yaml` manifest. See the design
# doc section 7 and homelab/mcp-gateway/registry/README.md for the full flow.
#
# Implements all 6 stages from the design:
#   1. secret-scan        -- security-checks.yml, `scan` job (gitleaks step)
#   2. sast               -- security-checks.yml, same `scan` job (semgrep step,
#                             standard pinned rules) + the rules-and-policy job
#                             below (this repo's MCP-specific rules).
#                             Stages 1 and 2 shared one workflow but ran as two
#                             jobs until 2026-08-13; they are now one job with a
#                             step each, since there is only one runner and the
#                             split bought parallelism that never existed.
#   3. dep/container scan -- sca-scan.yml (osv-scanner) + container-scan.yml (trivy)
#   4. sbom + signing     -- sbom-sign job (syft + cosign sign-blob, keyless)
#   5. policy check       -- rules-and-policy job (conftest against this repo's Rego
#                             bundle: compose hardening + manifest structure)
#   6. egress allowlist   -- folded into that job's manifest namespace (a
#                             manifest missing network.egress, or declaring "*",
#                             is a deny there -- see policy/mcp-server-manifest.rego)
#
# Only after every job below passes does the calling repo's deploy.yml write the
# registry manifest and let gateway-sync pick it up. This workflow only checks --
# it has no write access to homelab's registry directory or the gateway itself.

on:
  workflow_call:
    inputs:
      server-path:
        description: "Directory containing the server's Dockerfile/docker-compose.yml, relative to the calling repo's root"
        type: string
        default: "."
        required: false
      dockerfile:
        description: "Dockerfile path, relative to the calling repo's root"
        type: string
        default: "Dockerfile"
        required: false
      compose-file:
        description: "docker-compose.yml path, relative to the calling repo's root. Empty string skips the compose policy check (e.g. a stdio-only server with no compose file yet)."
        type: string
        default: "docker-compose.yml"
        required: false
      manifest-path:
        description: "Path to the registry manifest yaml being added/changed for this server"
        type: string
        required: true
      server-name:
        description: "Server name, used to name the generated SBOM file"
        type: string
        required: true
      severity:
        description: "Trivy severity threshold that fails the build"
        type: string
        default: "CRITICAL,HIGH"
        required: false
      waive-container-scan:
        description: "Run container-scan and report findings, but don't let them fail gate-summary. For a documented, human-approved accepted-risk case only -- the calling repo's workflow must carry a comment naming who approved it, when, and why. See container-scan.yml's `waive` input."
        type: boolean
        default: false
        required: false
    secrets:
      CI_COMMON_READ_APP_ID:
        description: "App ID of the mcp-gateway-ci-common-reader GitHub App (Contents: Read-only, installed only on ci-common). The default GITHUB_TOKEN in a caller's workflow run can't check out a different private repo's contents, which the rules-and-policy job needs (it reads ci-common's own policy/ and semgrep-rules/ files) -- a short-lived App installation token stands in for that. Declared in an explicit secrets block rather than relying on `secrets: inherit`. Note these must be set as REPO-level secrets on each calling repo -- org-level secrets resolve empty on this org's Free plan (see README)."
        required: true
      CI_COMMON_READ_APP_PRIVATE_KEY:
        description: "Private key (PEM) for the mcp-gateway-ci-common-reader GitHub App."
        required: true

permissions:
  contents: read
  id-token: write   # required for cosign keyless signing (Sigstore/Fulcio OIDC)

jobs:
  secret-scan-and-sast:
    uses: mikrosag/ci-common/.github/workflows/security-checks.yml@v1

  sca-scan:
    uses: mikrosag/ci-common/.github/workflows/sca-scan.yml@v1

  container-scan:
    uses: mikrosag/ci-common/.github/workflows/container-scan.yml@v1
    with:
      dockerfile: ${{ inputs.dockerfile }}
      severity: ${{ inputs.severity }}
      waive: ${{ inputs.waive-container-scan }}

  # mcp-semgrep-rules and policy-check were separate jobs until 2026-08-13.
  # Both performed exactly the same three setup steps -- checkout the caller,
  # mint a ci-common-scoped App installation token, checkout ci-common -- and
  # then ran a single tool each. That was 4 checkouts and 2 token mints per gate
  # run to do the work of 2 and 1, and with one self-hosted runner the two jobs
  # never overlapped anyway, so the split bought nothing.
  #
  # Every check runs with continue-on-error and a Verdict step decides the
  # outcome, so merging does not let the first failure hide the rest: a run
  # still reports the MCP semgrep rules, the compose policy and the manifest
  # policy independently.
  rules-and-policy:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: server
      # Checking out ci-common from a caller repo's workflow run needs a token
      # scoped to ci-common specifically -- the default GITHUB_TOKEN here is
      # scoped to the CALLING repo only (whatever repo invoked this reusable
      # workflow), never to ci-common itself, regardless of ci-common's own
      # "access_level: organization" repo setting (that setting only governs
      # whether OTHER repos may `uses:` ci-common's reusable workflows, a
      # separate permission model from actions/checkout reading its file
      # contents). Confirmed live 2026-07-25: this step 404s without an
      # explicit token, even with that setting already on. Mint a short-lived
      # installation token from a dedicated read-only GitHub App
      # (mcp-gateway-ci-common-reader, Contents: Read, installed only on
      # ci-common) rather than a long-lived PAT.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: ci-common-read-token
        with:
          app-id: ${{ secrets.CI_COMMON_READ_APP_ID }}
          private-key: ${{ secrets.CI_COMMON_READ_APP_PRIVATE_KEY }}
          owner: mikrosag
          repositories: ci-common
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikrosag/ci-common
          ref: main
          token: ${{ steps.ci-common-read-token.outputs.token }}
          path: ci-common

      # Scoped to server-path, not the whole checkout: for a dedicated
      # single-server repo (server-path defaults to ".") this scans the same
      # thing either way, but for a multi-service monorepo caller (e.g.
      # homelab) scanning "server" unscoped picks up every other unrelated
      # service's Python files too. Confirmed live 2026-08-10: homelab's
      # agentregistry onboarding flagged 2 findings in services/greenbone/
      # -- entirely unrelated code the gate had no business scanning.
      - name: MCP-specific semgrep rules
        id: mcp_semgrep
        continue-on-error: true
        working-directory: server
        env:
          SERVER_PATH: ${{ inputs.server-path }}
        run: semgrep scan --config ../ci-common/semgrep-rules/mcp-server.yml --error -- "$SERVER_PATH"

      # working-directory is just "server" (the checkout root), not
      # "server/${{ inputs.server-path }}": compose-file is already
      # root-relative (per its own input description above). The extra
      # server-path suffix used to double the path for monorepo callers --
      # confirmed live 2026-08-10 (homelab's agentregistry onboarding failed
      # with "server/services/agentregistry/services/agentregistry/docker-compose.yml:
      # no such file or directory").
      - name: Resolve compose config (if this server has one)
        id: compose_resolve
        if: inputs.compose-file != ''
        continue-on-error: true
        working-directory: server
        env:
          COMPOSE_FILE_PATH: ${{ inputs.compose-file }}
          WORKSPACE: ${{ github.workspace }}
        run: docker compose -f "$COMPOSE_FILE_PATH" config > "$WORKSPACE/compose-resolved.yml"

      - name: conftest -- compose hardening
        id: conftest_compose
        if: inputs.compose-file != ''
        continue-on-error: true
        run: conftest test --policy ci-common/policy --namespace main.compose compose-resolved.yml

      - name: conftest -- manifest structure + egress allowlist (stage 6)
        id: conftest_manifest
        continue-on-error: true
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
        run: conftest test --policy ci-common/policy --namespace main.manifest "server/$MANIFEST_PATH"

      # One verdict for the whole job, reporting every check rather than
      # stopping at the first failure.
      #
      # The two compose steps are legitimately skipped when a server has no
      # compose file (compose-file: "" -- e.g. a bare-metal stdio server), so
      # for those "skipped" means not-applicable, not failure. For the semgrep
      # and manifest checks a skip would mean something went wrong upstream and
      # is treated as a failure: this is a fail-closed admission gate, and
      # silently passing an unexecuted check is the one outcome it must not
      # produce.
      - name: Verdict
        run: |
          fail=0
          required() {
            case "$2" in
              success) echo "  PASS  $1" ;;
              *)       echo "  FAIL  $1 (outcome: $2)"; fail=1 ;;
            esac
          }
          optional() {
            case "$2" in
              success) echo "  PASS  $1" ;;
              skipped) echo "  N/A   $1 (no compose file for this server)" ;;
              *)       echo "  FAIL  $1 (outcome: $2)"; fail=1 ;;
            esac
          }
          required "MCP semgrep rules"        "${{ steps.mcp_semgrep.outcome }}"
          optional "compose config resolves"  "${{ steps.compose_resolve.outcome }}"
          optional "conftest compose policy"  "${{ steps.conftest_compose.outcome }}"
          required "conftest manifest policy" "${{ steps.conftest_manifest.outcome }}"
          if [ "$fail" -ne 0 ]; then
            echo "rules-and-policy failed -- see the individual step logs above." >&2
            exit 1
          fi
          echo "all rules and policy checks passed"

  sbom-sign:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    needs: [container-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No working-directory here: dockerfile is already root-relative (per
      # its own input description above), so cwd stays repo root. Setting
      # working-directory to server-path used to double the path for
      # monorepo callers passing e.g. dockerfile=services/agentregistry/Dockerfile
      # with server-path=services/agentregistry -- confirmed live 2026-08-10.
      - name: Build image for SBOM
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          SERVER_NAME: ${{ inputs.server-name }}
          TAG: ${{ github.sha }}
        run: docker build -f "$DOCKERFILE" -t "local/mcp-sbom:${SERVER_NAME}-${TAG}" .
      - name: Generate SBOM (Syft, CycloneDX)
        env:
          SERVER_NAME: ${{ inputs.server-name }}
          TAG: ${{ github.sha }}
        run: |
          mkdir -p sbom
          syft "local/mcp-sbom:${SERVER_NAME}-${TAG}" -o cyclonedx-json > "sbom/${SERVER_NAME}-$(date +%Y.%m.%d).json"
      - name: Sign the SBOM (cosign, keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          SERVER_NAME: ${{ inputs.server-name }}
        # cosign v3 removed --output-signature/--output-certificate entirely
        # (confirmed live 2026-07-24 against the installed v3.1.1 -- both flags
        # are gone from `cosign sign-blob --help` and the command now hard-errors
        # "must specify --bundle with --new-bundle-format"). The old two-file
        # .sig+.pem output is replaced by a single Sigstore bundle file
        # (signature+certificate+transparency-log-proof together).
        #
        # The cascading change this note used to flag as outstanding --
        # automation/scripts/gateway_sync.py's verify_attestation() still
        # expecting the old two-file .sig/.pem shape -- has since been made:
        # that function now reads `<attestation>.bundle` and shells out to
        # `cosign verify-blob --bundle`. Confirmed end-to-end 2026-08-10 by
        # verifying a committed pair straight out of homelab's registry
        # (mcp-gateway/registry/sbom/mcp-spotlight-facts.json{,.bundle}) with
        # the exact arguments gateway_sync uses: "Verified OK", exit 0. Nothing
        # is outstanding here -- the stale wording had already sent one reader
        # chasing a bug that no longer exists.
        run: |
          SBOM_FILE="sbom/${SERVER_NAME}-$(date +%Y.%m.%d).json"
          cosign sign-blob --yes \
            --bundle "${SBOM_FILE}.bundle" \
            "$SBOM_FILE"
      - name: Verify the signature we just produced
        env:
          SERVER_NAME: ${{ inputs.server-name }}
        run: |
          SBOM_FILE="sbom/${SERVER_NAME}-$(date +%Y.%m.%d).json"
          cosign verify-blob \
            --bundle "${SBOM_FILE}.bundle" \
            --certificate-identity-regexp ".*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$SBOM_FILE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ inputs.server-name }}
          # The calling repo's PR is expected to commit these files (sbom.json +
          # .bundle) at the path referenced by the manifest's security.attestation
          # field -- this job produces them, it doesn't commit on the caller's
          # behalf, since which repo/path is caller-specific.
          path: sbom/

  gate-summary:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    needs:
      [
        secret-scan-and-sast,
        sca-scan,
        container-scan,
        rules-and-policy,
        sbom-sign,
      ]
    if: always()
    steps:
      - name: Fail closed if any stage failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more security-gate stages failed -- no manifest may be written, no deploy may proceed."
            exit 1
          fi
          echo "All mcp-server-security-gate stages passed."
